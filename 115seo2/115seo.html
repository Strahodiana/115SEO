
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HARE // 2026 Ultra-Modern Men's Collection</title>
    <style>
        /* 高級暗黑美學變數 */
        :root {
            --bg-dark: #0a0a0c;
            --accent-teal: #00f2fe;
            --accent-purple: #4facfe;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f5f5f7;
            --text-muted: #8e8e93;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            background: radial-gradient(circle at 80% 20%, rgba(79, 172, 254, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 10% 80%, rgba(0, 242, 254, 0.1) 0%, transparent 50%),
                        #0a0a0c;
            background-attachment: fixed;
        }

        /* 炫光霓虹頂部導覽列 */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 1000;
        }

        .nav-box {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
        }

        .brand-logo {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 6px;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-teal));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 3rem;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.4s ease;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-teal);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-links a:hover {
            color: var(--accent-teal);
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
        }

        /* 全螢幕大器 Hero 區塊 */
        .hero-section {
            height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 1rem;
            margin-top: 60px;
        }

        .hero-title {
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: 15px;
            text-transform: uppercase;
            margin-bottom: 1rem;
            animation: textGlow 4s infinite alternate;
        }

        /* 打字機動態特效 */
        .typewriter {
            font-size: 1.5rem;
            color: var(--accent-teal);
            letter-spacing: 4px;
            border-right: 2px solid var(--accent-teal);
            white-space: nowrap;
            overflow: hidden;
            animation: typing 3.5s steps(30, end) infinite, blink-caret 0.75s step-end infinite;
            max-width: fit-content;
        }

        /* Lookbook 多欄網格與 3D 炫技卡片 */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        .section-headline {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 3rem;
            text-transform: uppercase;
            border-left: 4px solid var(--accent-purple);
            padding-left: 1rem;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 3rem;
        }

        /* 摩砂玻璃與 3D 浮雕懸浮卡片 */
        .hare-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
        }

        .hare-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 16px;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .hare-card:hover::before {
            transform: translateX(100%);
        }

        .hare-card:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: rgba(0, 242, 254, 0.4);
            box-shadow: 0 20px 40px rgba(0, 242, 254, 0.15);
        }

        .img-wrapper {
            width: 100%;
            height: 420px;
            overflow: hidden;
            position: relative;
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .hare-card:hover .img-wrapper img {
            transform: scale(1.08);
        }

        /* 卡片內文字編排 */
        .card-body {
            padding: 2rem;
        }

        .style-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-teal);
            margin-bottom: 0.5rem;
            display: inline-block;
        }

        .item-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            letter-spacing: 1px;
        }

        .item-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 1.5rem;
        }

        /* 炫光互動按鈕 */
        .action-button {
            display: inline-block;
            width: 100%;
            text-align: center;
            padding: 0.8rem;
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            border-radius: 8px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .hare-card:hover .action-button {
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-teal));
            border-color: transparent;
            color: #000000;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        /* 頁尾 */
        footer {
            text-align: center;
            padding: 4rem 2rem;
            border-top: 1px solid var(--glass-border);
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        /* 炫技動畫定義 */
        @keyframes textGlow {
            0% { text-shadow: 0 0 10px rgba(255,255,255,0.2), 0 0 20px rgba(79,172,254,0.2); }
            100% { text-shadow: 0 0 20px rgba(0,242,254,0.6), 0 0 40px rgba(4facfe,0.4); }
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: var(--accent-teal); }
        }

        /* 自適應 RWD 手機優化 */
        @media (max-width: 768px) {
            .hero-title { font-size: 3rem; letter-spacing: 8px; }
            .typewriter { font-size: 1.1rem; }
            .main-container { padding: 2rem 1rem; }
        }
    </style>
</head>
